<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Google Sans", Arial, sans-serif;
        font-size: 13px;
        color: #202124;
        margin: 0;
        padding: 12px 16px 16px;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 12px;
        color: #1a73e8;
      }
      label {
        display: block;
        font-weight: 500;
        margin: 12px 0 4px;
      }
      .hint {
        font-size: 11px;
        color: #80868b;
        margin: 0 0 4px;
      }
      textarea {
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
        resize: vertical;
        min-height: 80px;
        font-family: monospace;
      }
      textarea:read-only,
      input:disabled {
        background: #f8f9fa;
        color: #80868b;
        cursor: not-allowed;
      }
      textarea:focus {
        outline: none;
        border-color: #1a73e8;
      }
      input[type="number"] {
        width: 80px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: #1a73e8;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-right: 6px;
        accent-color: #1a73e8;
        cursor: pointer;
        vertical-align: middle;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        font-weight: normal;
        margin: 8px 0 0;
        cursor: pointer;
      }
      .checkbox-label input[type="checkbox"] {
        flex-shrink: 0;
      }
      .section-divider {
        border: none;
        border-top: 1px solid #e8eaed;
        margin: 16px 0 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        flex: 1;
        padding: 8px 0;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      #saveBtn {
        background: #1a73e8;
        color: #fff;
      }
      #saveBtn:hover {
        background: #1557b0;
      }
      #resetBtn {
        background: #f1f3f4;
        color: #3c4043;
      }
      #resetBtn:hover {
        background: #e8eaed;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 18px;
        text-align: center;
      }
      .ok {
        color: #188038;
      }
      .err {
        color: #d93025;
      }
    </style>
  </head>
  <body>
    <h3 data-i18n="sidebarTitle">⚙️ 個人設定</h3>

    <label><span data-i18n="labelSources">📡 來源</span></label>
    <label class="checkbox-label" for="scanLinkedIn">
      <input type="checkbox" id="scanLinkedIn" checked />
      <span data-i18n="labelScanLinkedIn">掃描 LinkedIn 職缺提醒信件</span>
    </label>
    <label class="checkbox-label" for="scanIndeed">
      <input type="checkbox" id="scanIndeed" checked />
      <span data-i18n="labelScanIndeed">掃描 Indeed 職缺提醒信件</span>
    </label>

    <hr class="section-divider" />

    <label for="titleKw"><span data-i18n="labelTitleKw">職稱關鍵字 (+1 分)</span></label>
    <div class="hint" data-i18n="hintKeywords">每行一個關鍵字 (英文不分大小寫)</div>
    <textarea id="titleKw" rows="6" readonly></textarea>

    <label for="domainKw"><span data-i18n="labelDomainKw">產業 / 領域關鍵字 (+1 分)</span></label>
    <div class="hint" data-i18n="hintKeywords">每行一個關鍵字 (英文不分大小寫)</div>
    <textarea id="domainKw" rows="6" readonly></textarea>

    <label for="locationKw"><span data-i18n="labelLocationKw">偏好地點關鍵字 (+1 分)</span></label>
    <div class="hint" data-i18n="hintKeywords">每行一個關鍵字 (英文不分大小寫)</div>
    <textarea id="locationKw" rows="4" readonly></textarea>

    <label for="days" data-i18n="labelDays">掃描最近幾天的信件</label>
    <input type="number" id="days" min="1" max="30" value="7" disabled />

    <div class="actions">
      <button id="saveBtn" onclick="save()" data-i18n="btnSave" disabled>💾 儲存</button>
      <button id="resetBtn" onclick="resetDefaults()" data-i18n="btnReset" disabled>↩ 還原預設</button>
    </div>
    <div id="status"></div>

    <script>
      var UI = {}; // populated by getUiStrings() on load

      function applyStrings(strings) {
        UI = strings;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (strings[key] !== undefined) el.textContent = strings[key];
        });
      }

      function arrToText(arr) {
        return (arr || []).join("\n");
      }
      function textToArr(text) {
        return text
          .split("\n")
          .map(function (s) {
            return s.trim();
          })
          .filter(function (s) {
            return s.length > 0;
          });
      }

      function setStatus(msg, isErr) {
        var el = document.getElementById("status");
        el.textContent = msg;
        el.className = isErr ? "err" : "ok";
      }

      function populate(settings) {
        document.getElementById("titleKw").value = arrToText(settings.titleKeywords);
        document.getElementById("domainKw").value = arrToText(settings.domainKeywords);
        document.getElementById("locationKw").value = arrToText(settings.locationKeywords);
        document.getElementById("days").value = settings.daysToScan;
        document.getElementById("scanLinkedIn").checked = settings.isLinkedInEnabled !== false;
        document.getElementById("scanIndeed").checked = settings.isIndeedEnabled !== false;
        ["titleKw", "domainKw", "locationKw"].forEach(function (id) {
          document.getElementById(id).removeAttribute("readonly");
        });
        document.getElementById("days").disabled = false;
        document.getElementById("saveBtn").disabled = false;
        document.getElementById("resetBtn").disabled = false;
      }

      function save() {
        var data = {
          titleKeywords: textToArr(document.getElementById("titleKw").value),
          domainKeywords: textToArr(document.getElementById("domainKw").value),
          locationKeywords: textToArr(document.getElementById("locationKw").value),
          daysToScan: parseInt(document.getElementById("days").value, 10) || 7,
          isLinkedInEnabled: document.getElementById("scanLinkedIn").checked,
          isIndeedEnabled: document.getElementById("scanIndeed").checked,
        };
        setStatus(UI.statusSaving || "Saving…", false);
        google.script.run
          .withSuccessHandler(function () {
            setStatus(UI.statusSaved || "✅ Saved!", false);
          })
          .withFailureHandler(function (e) {
            setStatus((UI.statusSaveError || "❌ {msg}").replace("{msg}", e.message), true);
          })
          .saveSettings(data);
      }

      function resetDefaults() {
        if (!window.confirm(UI.confirmReset)) return;
        setStatus(UI.statusResetting || "Loading defaults…", false);
        google.script.run
          .withSuccessHandler(function (defaults) {
            populate(defaults);
            save();
          })
          .withFailureHandler(function (e) {
            setStatus((UI.statusLoadError || "❌ {msg}").replace("{msg}", e.message), true);
          })
          .getDefaultSettings();
      }

      // Load UI strings first, then populate form with saved settings
      const LOADING_PLACEHOLDER = "(loading...)";
      document.getElementById("titleKw").value = LOADING_PLACEHOLDER;
      document.getElementById("domainKw").value = LOADING_PLACEHOLDER;
      document.getElementById("locationKw").value = LOADING_PLACEHOLDER;

      google.script.run
        .withSuccessHandler(function (strings) {
          applyStrings(strings);
          google.script.run
            .withSuccessHandler(populate)
            .withFailureHandler(function (e) {
              setStatus((UI.statusLoadError || "❌ {msg}").replace("{msg}", e.message), true);
            })
            .loadSettingsForSidebar();
        })
        .withFailureHandler(function () {
          // Fall back: load settings without i18n
          google.script.run.withSuccessHandler(populate).loadSettingsForSidebar();
        })
        .getUiStrings();
    </script>
  </body>
</html>
